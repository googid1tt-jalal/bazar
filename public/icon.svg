<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f4c542"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="75%" stop-color="#f4c542"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <!-- Star Gold Gradient -->
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#f4c542"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Clip Path for 4 Quadrants Circle -->
    <clipPath id="innerCircleClip">
      <circle cx="256" cy="256" r="216"/>
    </clipPath>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Shadow & Gold Rim Ring -->
  <circle cx="256" cy="256" r="248" fill="url(#goldRim)"/>
  <circle cx="256" cy="256" r="226" fill="#0f5132"/>
  <circle cx="256" cy="256" r="220" fill="url(#goldRim)"/>

  <!-- 4 Quadrants inside inner circle -->
  <g clip-path="url(#innerCircleClip)">
    <!-- Quadrant 1 (Top Right - Pashtun Pakol / KPK Emerald Green) -->
    <rect x="256" y="36" width="220" height="220" fill="#0f5132"/>
    <!-- Pashtun Pakol Hat Motif -->
    <g transform="translate(330, 115) scale(0.9)">
      <ellipse cx="40" cy="50" rx="36" ry="14" fill="#d97706" opacity="0.3"/>
      <!-- Pakol Brim Roll -->
      <path d="M 10 45 Q 40 30 70 45 Q 75 55 65 60 Q 40 68 15 60 Q 5 55 10 45 Z" fill="#d4b996" stroke="#5a3e1b" stroke-width="2.5"/>
      <ellipse cx="40" cy="42" rx="30" ry="12" fill="#e7d7c1"/>
      <!-- Wool top puff -->
      <path d="M 18 42 C 18 20 62 20 62 42 Z" fill="#cbb493" stroke="#5a3e1b" stroke-width="1.5"/>
      <!-- Small Pakol feather/crest accent -->
      <path d="M 28 32 Q 22 15 25 10 Q 30 18 32 30 Z" fill="#f4c542"/>
    </g>

    <!-- Quadrant 2 (Top Left - Baloch Embroidery Rosette / Navy Blue) -->
    <rect x="36" y="36" width="220" height="220" fill="#0f172a"/>
    <!-- Balochi Geometric Embroidery Rosette Motif -->
    <g transform="translate(110, 105) scale(0.95)">
      <circle cx="45" cy="45" r="34" fill="none" stroke="#f4c542" stroke-width="2.5" stroke-dasharray="4 3"/>
      <!-- Petals -->
      <polygon points="45,15 53,35 75,45 53,55 45,75 37,55 15,45 37,35" fill="#f43f5e"/>
      <polygon points="45,23 50,38 67,45 50,52 45,67 40,52 23,45 40,38" fill="#f4c542"/>
      <circle cx="45" cy="45" r="9" fill="#0f172a" stroke="#ffffff" stroke-width="2"/>
      <!-- Balochi mirror work center spark -->
      <circle cx="45" cy="45" r="4" fill="#38bdf8"/>
    </g>

    <!-- Quadrant 3 (Bottom Left - Sindhi Ajrak Diamond / Crimson Red) -->
    <rect x="36" y="256" width="220" height="220" fill="#881337"/>
    <!-- Sindhi Ajrak Geometric Star/Diamond Motif -->
    <g transform="translate(105, 305) scale(0.95)">
      <!-- Classic 8-point Ajrak Star -->
      <rect x="25" y="25" width="46" height="46" fill="#1e1b4b" stroke="#ffffff" stroke-width="2" transform="rotate(45 48 48)"/>
      <rect x="25" y="25" width="46" height="46" fill="#991b1b" stroke="#f4c542" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="14" fill="#ffffff"/>
      <circle cx="48" cy="48" r="10" fill="#1e1b4b"/>
      <circle cx="48" cy="48" r="4" fill="#f4c542"/>
      <!-- Ajrak teardrop dots -->
      <circle cx="48" cy="20" r="2.5" fill="#ffffff"/>
      <circle cx="48" cy="76" r="2.5" fill="#ffffff"/>
      <circle cx="20" cy="48" r="2.5" fill="#ffffff"/>
      <circle cx="76" cy="48" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Quadrant 4 (Bottom Right - Saraiki Multani Blue Tile / Kashikari Blue) -->
    <rect x="256" y="256" width="220" height="220" fill="#0284c7"/>
    <!-- Multani Kashi Blue Tile Floral Star Motif -->
    <g transform="translate(325, 305) scale(0.95)">
      <rect x="20" y="20" width="56" height="56" fill="#0369a1" stroke="#e0f2fe" stroke-width="2.5" rx="6"/>
      <!-- Turquoise floral cross -->
      <path d="M 48 24 C 40 36 40 40 24 48 C 40 56 40 60 48 72 C 56 60 56 56 72 48 C 56 40 56 36 48 24 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="48" cy="48" r="11" fill="#0f172a"/>
      <circle cx="48" cy="48" r="6" fill="#facc15"/>
      <!-- Corner flourishes -->
      <circle cx="28" cy="28" r="3" fill="#ffffff"/>
      <circle cx="68" cy="28" r="3" fill="#ffffff"/>
      <circle cx="28" cy="68" r="3" fill="#ffffff"/>
      <circle cx="68" cy="68" r="3" fill="#ffffff"/>
    </g>

    <!-- Quadrant Dividing Cross (Gold Lines) -->
    <line x1="256" y1="36" x2="256" y2="476" stroke="url(#goldRim)" stroke-width="6"/>
    <line x1="36" y1="256" x2="476" y2="256" stroke="url(#goldRim)" stroke-width="6"/>
  </g>

  <!-- Central Gold Star Badge with Shopping Bag -->
  <g filter="url(#dropShadow)">
    <!-- 8-pointed Gold Star Badge -->
    <polygon points="256,170 274,214 322,204 298,246 338,272 292,286 296,334 256,310 216,334 220,286 174,272 214,246 190,204 238,214" fill="url(#starGold)" stroke="#854d0e" stroke-width="3"/>
    
    <!-- Central Dark Green Circle inside Badge -->
    <circle cx="256" cy="256" r="42" fill="#0f5132" stroke="#fef08a" stroke-width="2.5"/>

    <!-- Shopping Bag Icon (Gold & White) -->
    <g transform="translate(236, 234)">
      <!-- Bag Handles -->
      <path d="M 12 14 C 12 4 28 4 28 14" fill="none" stroke="#f4c542" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Bag Body -->
      <path d="M 5 14 L 35 14 L 38 38 C 38 41 36 43 33 43 L 7 43 C 4 43 2 41 2 38 Z" fill="#ffffff" stroke="#f4c542" stroke-width="2"/>
      <!-- Hunar Yarn / Flower on Bag -->
      <circle cx="20" cy="28" r="5" fill="#f4c542"/>
      <circle cx="20" cy="28" r="2" fill="#0f5132"/>
    </g>
  </g>
</svg>
